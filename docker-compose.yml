# PlanItPoker — Container deploy (same-origin via Nginx proxy).
#
# Usage:
#   docker compose up --build            # client on http://localhost, server on http://localhost:5000
#   VITE_WS_URL=wss://api.exemplo.com docker compose up --build   # client dials an external backend directly
#
# Services:
# - server: Node 24 + Express + ws. Health at GET /api/health.
# - client: Nginx serving the Vite SPA. Proxies /api/* and /ws to `server`,
#   so an empty VITE_WS_URL (default) uses window.location.host with no CORS setup.

services:
    server:
        build:
            context: .
            dockerfile: apps/server/Dockerfile
        image: planitpoker-server:local
        container_name: planitpoker-server
        restart: unless-stopped
        ports:
            - '${SERVER_PORT:-5000}:5000'
        environment:
            - PORT=5000
            - NODE_ENV=production
            # Same-origin (compose) needs no CORS config; keep defaults for direct access / local dev.
            - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://localhost:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            start_period: 10s
            retries: 3

    client:
        build:
            context: .
            dockerfile: apps/client/Dockerfile
            args:
                # Empty = same-origin (recommended with compose). Set to reach an external backend.
                VITE_WS_URL: '${VITE_WS_URL:-}'
        image: planitpoker-client:local
        container_name: planitpoker-client
        restart: unless-stopped
        ports:
            - '${CLIENT_PORT:-80}:8080'
        depends_on:
            server:
                condition: service_healthy
