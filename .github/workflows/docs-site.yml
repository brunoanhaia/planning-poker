# The documentation site: built from docs/ on every pull request, deployed to
# GitHub Pages when main merges. One source, one artifact — no manual publish.
#
# One-time setup: Settings → Pages → Source must be "GitHub Actions" for the
# deploy job to have somewhere to publish.
name: Docs site

on:
    pull_request:
        paths:
            - 'docs/**'
            - 'package.json'
            - 'package-lock.json'
    push:
        branches: [main]
        paths:
            - 'docs/**'
            - 'package.json'
            - 'package-lock.json'

permissions:
    contents: read

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  cache: npm
                  node-version: 24

            - run: npm ci --ignore-scripts

            - run: npm run docs:build

            - name: Upload the artifact for the Pages deploy
              if: github.event_name == 'push'
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: docs/.vitepress/dist

    deploy:
        name: Deploy to Pages
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: build
        permissions:
            id-token: write
            pages: write
        runs-on: ubuntu-latest
        steps:
            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
