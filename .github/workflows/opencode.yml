name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  mention:
    name: Respond to mention
    permissions:
      contents: read
      id-token: write
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
          OPENCODE_CLIENT_ID: ${{ secrets.OPENCODE_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$OPENCODE_CLIENT_ID" ]; then
            echo "::error::OPENCODE_CLIENT_ID is not set"
            exit 1
          fi
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id="$OPENCODE_CLIENT_ID" \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          OPENCODE_CONFIG_CONTENT: |
            {
              "permission": {
                "external_directory": {
                  "*": "deny",
                  "/tmp/**": "allow"
                },
                "doom_loop": "deny",
                "question": "deny",
                "read": {
                  "*": "allow",
                  "*.env": "deny",
                  "*.env.*": "deny",
                  "*.env.example": "allow"
                }
              }
            }
        with:
          model: opencode-go/deepseek-v4.1-flash

  review:
    name: Review pull request
    permissions:
      contents: read
      id-token: write
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
          OPENCODE_CLIENT_ID: ${{ secrets.OPENCODE_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$OPENCODE_CLIENT_ID" ]; then
            echo "::error::OPENCODE_CLIENT_ID is not set"
            exit 1
          fi
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id="$OPENCODE_CLIENT_ID" \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          OPENCODE_CONFIG_CONTENT: |
            {
              "permission": {
                "external_directory": {
                  "*": "deny",
                  "/tmp/**": "allow"
                },
                "doom_loop": "deny",
                "question": "deny",
                "read": {
                  "*": "allow",
                  "*.env": "deny",
                  "*.env.*": "deny",
                  "*.env.example": "allow"
                }
              }
            }
        with:
          model: opencode-go/deepseek-v4.1-flash
          prompt: |
            Review this pull request following AGENTS.md and CONTRIBUTING.md.
            Focus on correctness, security, accessibility (WCAG AA), strict
            typing, and consistency with the monorepo conventions.
            Report only actionable findings with file:line references; do not
            restate the diff.
