# Release on every merge into `main`.
#
# `release-please` reads the Conventional Commit messages since the last tag and
# keeps a release pull request open. Merging that pull request writes the next
# version to `CHANGELOG.md`, the root `package.json`, `package-lock.json` and
# `.release-please-manifest.json`, then publishes the tag and the GitHub
# release. Nothing is published to npm — the workspace is private.
#
# The action reads `RELEASE_TOKEN` when that secret exists and otherwise uses
# the default `GITHUB_TOKEN`. A PAT triggers the release pull request checks;
# the default token does not. Neither needs a GitHub App private key.
name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release-please:
        name: Release pull request
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
              with:
                  token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
