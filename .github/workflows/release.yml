# Release on every merge into `main`.
#
# `release-please` reads the Conventional Commit messages since the last tag and
# keeps a release pull request open. Merging that pull request writes the next
# version to `CHANGELOG.md`, the root `package.json`, `package-lock.json` and
# `.release-please-manifest.json`, then publishes the tag and the GitHub
# release. Nothing is published to npm — the workspace is private.
#
# The action uses a GitHub App token so the release pull request triggers the
# normal pull request checks. The app never pushes to `main`, so it does not
# need a ruleset bypass.
name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release-please:
        name: Release pull request
        runs-on: ubuntu-latest
        steps:
            - name: Create release token
              id: release-token
              uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
              with:
                  app-id: ${{ secrets.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
              with:
                  token: ${{ steps.release-token.outputs.token }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
