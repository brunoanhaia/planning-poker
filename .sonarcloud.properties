# SonarQube Cloud's automatic analysis reads this file from the default branch.
#
# Translation catalogs are parallel data by design: every locale repeats the same
# keys so the compiler can prove parity, and the copy-paste detector ignores the
# string literals, so the catalogs always look like copies of each other. That is
# why they are excluded from duplication detection here; key parity is enforced
# instead by apps/server/tests/translationCatalogs.test.ts and the typed JSON
# import in apps/client/src/i18n/dictionary.ts.
#
# When a language is added, add its module to this list.
sonar.cpd.exclusions=apps/client/src/i18n/dictionary.ts,apps/client/src/i18n/locales/en.json,apps/client/src/i18n/locales/pt-BR.json,apps/client/src/i18n/locales/es.json
