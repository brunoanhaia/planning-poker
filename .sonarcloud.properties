# SonarQube Cloud's automatic analysis reads this file from the default branch.
#
# apps/client/src/i18n/locales holds translation catalogs only: JSON data, one
# key → string map per language. It is excluded from the scan as a whole rather
# than file by file, so adding a language needs no analysis change. The copy-paste
# detector would otherwise flag the catalogs, because it ignores string literals
# and the locales repeat the same keys by construction.
#
# The folder's invariant — nothing but JSON catalogs — is enforced by
# apps/server/tests/translationCatalogs.test.ts.
sonar.exclusions=apps/client/src/i18n/locales/**
