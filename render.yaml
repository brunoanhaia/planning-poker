services:
  - type: web
    name: planitpoker-server
    runtime: node
    rootDir: apps/server
    buildCommand: cd ../.. && npm install && npm run build:shared && npm --workspace=@planitpoker/server run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://planitpoker.vercel.app" # Substitua pelo seu domínio Vercel
      # PORT is automatically set by Render
    autoDeploy: true
    # Apenas refazer o build se houver mudança no server ou shared package
    buildFilter:
      paths:
        - "apps/server/**"
        - "packages/shared/**"
        - "../../package.json"
        - "../../package-lock.json"
