# PlanItPoker — Nginx for the Vite SPA.
# - Serves the static bundle with SPA fallback.
# - Proxies /api/* and /ws to the `server` service on the compose network.
#   This enables same-origin deploys: no VITE_WS_URL needed, no CORS issues.
#   When VITE_WS_URL is set at build time, the browser connects directly
#   and these proxy rules act only as a fallback.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers live at server level so they also cover /api/, /ws and
    # /assets/. A header added inside a single `location` is only sent for that
    # route, which is why they used to be missing everywhere else.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The SPA ships no inline script or style of its own, so a self-only policy
    # is enough; the backend is the only other origin it needs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    # Only meaningful once the deployment is served over TLS; harmless on plain
    # HTTP because browsers ignore HSTS on insecure responses.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Backend API (e.g. GET /api/health).
    # `X-Forwarded-For` is overwritten, never appended to: a client that sends
    # its own values would otherwise prepend forged entries, and Express —
    # trusting a single hop — would read the right-most entry the client
    # controls. `$remote_addr` is the address Nginx actually accepted the
    # connection from, so the header always holds one real client address.
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoint (native `ws`, no Socket.IO).
    location /ws {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static assets: long-term caching (Vite emits hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback. The security headers come from the server block, so this
    # location only has to decide which file to serve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
